<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerable Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Section -->
        <section id="login-section" class="container">
            <h1>Task Manager</h1>
            <p>Please login to manage your tasks.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
                <div id="login-error" class="error"></div>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="container hidden">
            <header>
                <h2>Welcome, <span id="user-display"></span></h2>
                <button id="logout-btn" class="btn-outline">Logout</button>
            </header>

            <div class="card">
                <h3>Create New Task</h3>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Title</label>
                        <input type="text" id="task-title" required>
                    </div>
                    <div class="form-group">
                        <label for="task-desc">Description (Supports HTML!)</label>
                        <textarea id="task-desc" rows="3"></textarea>
                    </div>
                    <button type="submit">Add Task</button>
                </form>
            </div>

            <div class="tasks-container">
                <h3>Your Tasks</h3>
                <div id="tasks-list">
                    <!-- Tasks will be rendered here via JS -->
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
